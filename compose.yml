name: echo

services:
  # Runs every jail. Privileged because nsjail creates namespaces and mounts, and the jail
  # firewall needs iptables. It holds no secrets and no agent state.
  sandbox:
    build:
      context: ./runner
      target: app
    privileged: true
    # Set in .env like the api's settings; compose fills it in.
    environment:
      RUNNER_AGENT_DISK_MB: ${ECHO_AGENT_DISK_MB:-2048}
    volumes:
      - sandbox-data:/data
      - runner-socket:/run/echo
    # Its own network: the two containers share only the socket volume, so even a process that
    # escaped a jail to root in this container has no network path to the api.
    networks: [sandbox-net]

  # Holds the provider keys and runs the agent. Unprivileged, and it reaches workspaces only
  # through the runner's socket. Bound to localhost because there is no auth yet.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: app
    # shortcut: bound to this machine only, because jails have no CPU share, seccomp or egress abuse limits yet; publish it on another address only after that hardening.
    ports:
      - "127.0.0.1:${ECHO_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - api-data:/data
      - runner-socket:/run/echo
    networks: [api-net]
    depends_on:
      sandbox:
        condition: service_healthy

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    # Fake but valid values: stack tests never sign in to Microsoft or decrypt a real key.
    environment:
      ECHO_PUBLIC_URL: http://localhost:8000
      ECHO_MS_TENANT_ID: 11111111-1111-1111-1111-111111111111
      ECHO_MS_CLIENT_ID: 22222222-2222-2222-2222-222222222222
      ECHO_MS_CLIENT_SECRET: test-client-secret
      ECHO_SECRET_KEY: dGVzdC1vbmx5LWtleS1ub3QtYS1zZWNyZXQtMDAwMDA=
    networks: [api-net]
    volumes:
      - runner-socket:/run/echo
    # Stack tests talk to the real runner, so the sandbox must be up first.
    depends_on:
      sandbox:
        condition: service_healthy
    command: ["pytest", "-p", "no:cacheprovider", "-m", "stack or not stack"]

  # Jail tests: real jails, behind the same firewall entrypoint as the sandbox.
  sandbox-test:
    profiles: [test]
    build:
      context: ./runner
      target: test
    privileged: true
    networks: [sandbox-net]
    command: ["pytest", "-p", "no:cacheprovider", "-m", "jail or not jail"]

volumes:
  sandbox-data:
  api-data:
  runner-socket:

networks:
  sandbox-net:
  api-net:
